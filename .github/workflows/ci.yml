name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test_build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install system dependencies
              run: |
                  sudo apt update
                  sudo apt install -y pkg-config libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install llvm-tools-preview
              run: rustup component add llvm-tools-preview

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2

            - name: Build
              run: cargo build --release --locked

            - name: Test
              if: github.event_name == 'pull_request'
              run: cargo test --locked --all-targets

            - name: Generate coverage
              if: github.event_name == 'push'
              run: cargo llvm-cov --locked --all-targets --workspace --lcov --output-path lcov.info

            - name: Upload coverage to Coveralls
              if: github.event_name == 'push'
              uses: coverallsapp/github-action@v2
              with:
                  file: lcov.info
                  format: lcov
                  repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

    portable_provider:
        name: Portable provider (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt update
                  sudo apt install -y pkg-config libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2

            - name: Check
              run: cargo check --locked

            - name: Test portable provider
              run: cargo test --locked portable_devices -- --test-threads=1

    windows_installer:
        name: Windows installer validation
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  key: x86_64-pc-windows-msvc-installer

            - name: Build uncompressed release binary
              run: cargo build --release --locked --target x86_64-pc-windows-msvc

            - name: Package and validate Squirrel installer
              shell: pwsh
              run: |
                  $manifest = Get-Content -Raw Cargo.toml
                  if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
                    throw "Unable to read the package version from Cargo.toml."
                  }
                  ./scripts/windows/package-squirrel.ps1 `
                    -Version $Matches[1] `
                    -BinaryPath "target/x86_64-pc-windows-msvc/release/explorer.exe" `
                    -OutputDir "dist/squirrel-ci" `
                    -SquirrelWindowsVersion "2.0.1"
