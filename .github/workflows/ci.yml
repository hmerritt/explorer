name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test_build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install system dependencies
              run: |
                  sudo apt update
                  sudo apt install -y pkg-config libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install llvm-tools-preview
              run: rustup component add llvm-tools-preview

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2

            - name: Build
              run: cargo build --release --locked

            - name: Test
              if: github.event_name == 'pull_request'
              run: cargo test --locked --all-targets

            - name: Generate coverage
              if: github.event_name == 'push'
              run: cargo llvm-cov --locked --all-targets --workspace --lcov --output-path lcov.info

            - name: Upload coverage to Coveralls
              if: github.event_name == 'push'
              uses: coverallsapp/github-action@v2
              with:
                  file: lcov.info
                  format: lcov
                  repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

    portable_provider:
        name: Portable provider (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt update
                  sudo apt install -y pkg-config libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2

            - name: Check
              run: cargo check --locked

            - name: Test portable provider
              run: cargo test --locked portable_devices -- --test-threads=1
